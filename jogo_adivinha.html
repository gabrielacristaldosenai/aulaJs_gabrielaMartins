<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Adivinha</title>
</head>

<body>
    <script>
        function pulaLinha() {
            document.write("<br>" + "<br>");
        }
        function mostra(frase) {
            document.write(frase);
            pulaLinha();
        }
        var numPensado = Math.round(Math.random() * 10);
        var tentativas = 1;

        while (tentativas <= 3) {
            var chute = parseInt(prompt("Digite o seu chute: "));

            if (chute == numPensado) {
                mostra("Você ACERTOU!! O número realmente é " + numPensado);
                break;
            } else {
                mostra("Você ERRRRROOUUUU");
            }

            tentativas++
        }
        mostra("FIM");
    </script>
</body>

</html>
